[package]
name = "anjing-music-x"
version = "0.2.3"
description = "Anjing Music X desktop client"
edition = "2021"
rust-version = "1.90"
default-run = "anjing-music-x"

[lib]
name = "anjing_music_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.13.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }

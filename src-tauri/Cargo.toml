[package]
name = "anjing-music-x"
version = "0.1.0"
description = "Anjing Music X desktop client"
edition = "2021"
rust-version = "1.90"
default-run = "anjing-music-x"

[lib]
name = "anjing_music_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.13.1"
